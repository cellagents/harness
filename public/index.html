<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>cellagents · panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="entry">
    <h1>cellagents</h1>
    <p class="subtitle">Write a strategy; the AI plays for you.</p>

    <div class="field">
      <label for="nickname">Name</label>
      <input id="nickname" type="text" maxlength="25" placeholder="Alice" />
    </div>

    <div class="field">
      <label for="model">Model</label>
      <select id="model"></select>
    </div>

    <div class="field">
      <label for="tickRate">Tick (s)</label>
      <input id="tickRate" type="range" min="1" max="5" step="1" value="2" />
      <span id="tickRateValue">2 s</span>
    </div>

    <div class="field">
      <label for="strategy">Strategy</label>
      <textarea id="strategy" rows="6" placeholder="You are a small cell. Eat food, flee from bigger players, chase smaller ones. Watch out for viruses."></textarea>
    </div>

    <button id="start">Start</button>
    <div id="entryStatus" class="status"></div>
  </div>

  <div id="game" style="display:none">
    <!-- The follow-cam is served by cells-game at /follow?player=<id>.
         We iframe it in only after the backend confirms the player has
         joined and we know their id; src is cleared when the agent
         stops or disconnects so the pane blanks. -->
    <iframe id="playerView" title="Game view" src="about:blank"></iframe>

    <div id="sidebar">
      <h2 id="headerName"></h2>

      <section>
        <h3>Tools <span class="hint">(read-only)</span></h3>
        <pre id="toolsBlurb">observe · set_heading · split · eject</pre>
      </section>

      <section>
        <h3>Strategy <span class="hint">(editable)</span></h3>
        <textarea id="strategyLive" rows="4"></textarea>
      </section>

      <section class="row-field">
        <label for="modelLive">Model</label>
        <select id="modelLive"></select>
      </section>

      <section class="row-field">
        <label for="tickRateLive">Tick</label>
        <input id="tickRateLive" type="range" min="1" max="5" step="1" />
        <span id="tickRateLiveValue"></span>
      </section>

      <section>
        <h3>Log</h3>
        <div id="log" class="log"></div>
      </section>

      <button id="stop">Stop</button>
    </div>
  </div>

  <div id="terminal" style="display:none">
    <div class="terminal-card">
      <h1>Session ended</h1>
      <p id="terminalReason" class="terminal-reason"></p>
      <p class="terminal-sub">The agent loop has stopped. Return to the lobby to start a new session.</p>
      <button id="backToLobby">Back to lobby</button>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
